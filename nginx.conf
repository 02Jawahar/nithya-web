server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs: /music -> /music.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Long cache for fingerprint-free assets is risky; keep it modest
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /assets/docs/banyan-nation-research-report.pdf {
        add_header Content-Disposition 'inline; filename="Nitya-Lanka-Banyan-Nation-Report.pdf"';
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/pdf;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    error_page 404 /index.html;
}
