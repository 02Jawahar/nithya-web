# Cache policy: long-ish for static assets, nothing for HTML.
# Evaluated after rewrite, so it works under a subpath mount too.
map $uri $asset_expires {
    default        off;
    "~^/assets/"   7d;
}

# Friendlier filename when the report is saved.
map $uri $report_disposition {
    default                                              "";
    "/assets/docs/banyan-nation-research-report.pdf"     'inline; filename="Nitya-Lanka-Banyan-Nation-Report.pdf"';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Emit relative redirects. Behind a TLS-terminating proxy an absolute
    # redirect would rebuild the URL as http:// and drop the scheme.
    absolute_redirect off;

    expires $asset_expires;
    add_header Content-Disposition $report_disposition;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # --- Subpath mount: /nithya/... ---
    # Needed when Traefik routes a path prefix without stripping it.
    # The bare form must redirect to the trailing slash, or the browser
    # resolves relative asset URLs against the domain root and misses.
    location = /nithya {
        return 301 /nithya/;
    }
    location /nithya/ {
        rewrite ^/nithya/(.*)$ /$1 break;
        try_files $uri $uri.html $uri/ /index.html;
    }

    # --- Root mount ---
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    error_page 404 /index.html;
}
