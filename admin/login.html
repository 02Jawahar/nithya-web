<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in — Nitya Lanka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='50' fill='%2314151a'/><text x='50' y='68' font-size='52' font-family='Georgia,serif' fill='white' text-anchor='middle'>N</text></svg>">
<style>
  /* Same palette as the public site. */
  :root{
    --bg:#ffffff; --bg-soft:#faf9f7; --bg-tint:#f6f2ee;
    --ink:#14151a; --ink-2:#3b3f49; --muted:#6a707d;
    --line:#e7e5e1; --line-2:#f0eeea;
    --accent:#b04a2a; --accent-soft:#fbf1ec;
    --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 2px 6px rgba(20,21,26,.05), 0 18px 44px rgba(20,21,26,.08);
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    background:var(--bg-soft); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.7;
    -webkit-font-smoothing:antialiased;
    position:relative; overflow:hidden;
  }
  /* Echoes the warm glow behind the hero on the homepage. */
  body::before,body::after{
    content:""; position:absolute; border-radius:50%; pointer-events:none;
  }
  body::before{
    width:760px; height:760px; top:-320px; right:-200px;
    background:radial-gradient(closest-side, rgba(176,74,42,.10), transparent 70%);
  }
  body::after{
    width:620px; height:620px; bottom:-280px; left:-180px;
    background:radial-gradient(closest-side, rgba(176,74,42,.06), transparent 70%);
  }

  .card{
    position:relative; z-index:1;
    width:min(420px,100%);
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:20px;
    padding:40px 36px 34px;
    box-shadow:var(--shadow);
    text-align:center;
  }
  .brand-mark{
    width:52px; height:52px; margin:0 auto 20px;
    border-radius:50%; display:grid; place-items:center;
    background:var(--ink); color:#fff;
    font-family:var(--serif); font-size:1.05rem; letter-spacing:.02em;
  }
  h1{
    margin:0 0 6px; font-family:var(--serif); font-weight:600;
    font-size:1.65rem; letter-spacing:-.022em; line-height:1.2;
  }
  .sub{margin:0 0 28px; color:var(--muted); font-size:.93rem; line-height:1.55}

  form{text-align:left}
  .field{position:relative; margin-bottom:12px}
  .field svg.lead{
    position:absolute; left:15px; top:50%; transform:translateY(-50%);
    width:17px; height:17px; color:var(--muted); pointer-events:none;
  }
  input{
    width:100%; padding:14px 15px 14px 44px;
    border:1px solid var(--line); border-radius:12px;
    background:var(--bg-soft); color:var(--ink);
    font-family:inherit; font-size:.96rem;
    transition:border-color .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
  }
  input::placeholder{color:#9aa0ab}
  input:hover{border-color:#d9d5cf}
  input:focus{
    outline:none; background:var(--bg);
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  #password{padding-right:46px}
  .peek{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:36px; height:36px; display:grid; place-items:center;
    background:none; border:0; border-radius:9px; cursor:pointer; color:var(--muted);
  }
  .peek:hover{color:var(--ink); background:var(--bg-tint)}
  .peek svg{width:17px; height:17px}

  .hint{
    margin:0 0 22px; text-align:right;
    font-size:.82rem; color:var(--muted);
  }
  .hint button{
    background:none; border:0; padding:0; cursor:pointer;
    font:inherit; color:var(--accent); text-decoration:underline; text-underline-offset:2px;
  }
  .recover{
    display:none; margin:-8px 0 20px;
    padding:11px 14px; border-radius:11px;
    background:var(--bg-tint); border:1px solid var(--line);
    font-size:.84rem; color:var(--ink-2); line-height:1.5; text-align:left;
  }
  .recover.show{display:block}

  button.go{
    width:100%; padding:14px; border:1px solid var(--ink); border-radius:999px;
    background:var(--ink); color:#fff;
    font-family:inherit; font-size:.97rem; font-weight:560; letter-spacing:.005em;
    cursor:pointer;
    transition:transform .25s var(--ease), background .25s var(--ease), box-shadow .25s var(--ease);
  }
  button.go:hover{transform:translateY(-2px); background:#000; box-shadow:var(--shadow)}
  button.go[disabled]{opacity:.55; transform:none; cursor:progress; box-shadow:none}

  .err{
    display:none; margin:0 0 18px; padding:11px 14px; border-radius:11px;
    font-size:.87rem; text-align:left;
    background:var(--accent-soft); border:1px solid rgba(176,74,42,.25); color:var(--accent);
  }
  .err.show{display:block}

  .foot{
    margin:26px 0 0; padding-top:20px; border-top:1px solid var(--line-2);
    font-size:.8rem; color:var(--muted); letter-spacing:.02em;
  }
  .foot a{color:var(--muted)}

  @media (max-width:420px){
    .card{padding:32px 24px 28px; border-radius:16px}
    h1{font-size:1.45rem}
  }
</style>
</head>
<body>

  <div class="card">
    <div class="brand-mark">NL</div>
    <h1>Sign in</h1>
    <p class="sub">Edit the content of the Nitya&nbsp;Lanka website.</p>

    <div class="err" id="err"></div>

    <form id="form" novalidate>
      <div class="field">
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="3"/><path d="m3 7 9 6 9-6"/>
        </svg>
        <input id="email" name="username" type="email" inputmode="email"
               autocomplete="username" placeholder="Email" aria-label="Email" autofocus>
      </div>

      <div class="field">
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
        </svg>
        <input id="password" name="password" type="password"
               autocomplete="current-password" placeholder="Password" aria-label="Password">
        <button class="peek" id="peek" type="button" aria-label="Show password">
          <svg id="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <p class="hint"><button type="button" id="forgot">Forgotten your password?</button></p>
      <div class="recover" id="recover">
        Passwords are not emailed. Ask whoever set up the site to reset it for you &mdash;
        it takes them about ten seconds.
      </div>

      <button class="go" id="go" type="submit">Sign in</button>
    </form>

    <p class="foot">Nitya Lanka &middot; Content manager</p>
  </div>

<script>
  var form = document.getElementById('form');
  var err = document.getElementById('err');
  var go = document.getElementById('go');
  var email = document.getElementById('email');
  var password = document.getElementById('password');

  document.getElementById('peek').addEventListener('click', function () {
    var showing = password.type === 'text';
    password.type = showing ? 'password' : 'text';
    this.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    // Swap between the open eye and the struck-through one.
    document.getElementById('eye').innerHTML = showing
      ? '<path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>'
      : '<path d="M10.7 6.2A9.8 9.8 0 0 1 12 6c6.2 0 10 6 10 6a17 17 0 0 1-3.2 3.8M6.2 8.2A17 17 0 0 0 2 12s3.8 6 10 6c1.5 0 2.9-.3 4.1-.9"/><path d="m3 3 18 18"/>';
    password.focus();
  });

  document.getElementById('forgot').addEventListener('click', function () {
    document.getElementById('recover').classList.toggle('show');
  });

  function fail(message) {
    err.textContent = message;
    err.classList.add('show');
    go.disabled = false;
    go.textContent = 'Sign in';
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    err.classList.remove('show');

    if (!email.value.trim() || !password.value) {
      return fail('Please enter your email and password.');
    }

    go.disabled = true;
    go.textContent = 'Signing in…';

    try {
      var res = await fetch(location.pathname, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ username: email.value.trim(), password: password.value }),
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || 'Sign in failed.');
      location.href = data.redirect || location.pathname.replace(/\/login$/, '/');
    } catch (e2) {
      fail(e2.message);
      password.select();
    }
  });
</script>
</body>
</html>
